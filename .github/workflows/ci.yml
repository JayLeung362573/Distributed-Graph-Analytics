name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential openmpi-bin libopenmpi-dev make python3

      - name: Generate test graph
        run: python3 scripts/generate_small_graph.py

      - name: Verify graph files
        run: |
          ls -lh data/
          test -f data/small_graph.csr
          test -f data/small_graph.csc

      - name: Build
        run: make

      - name: Run correctness tests
        run: make test

      - name: Generate degree-skewed benchmark graph
        run: make generate-skewed

      - name: Run partition workload benchmark
        run: make benchmark-partition

      - name: Verify reproducible partition results
        run: git diff --exit-code -- benchmarks/partition_loads.csv